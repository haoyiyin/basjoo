# ============================================
# Basjoo Docker Compose 配置
# 使用 Profile 区分环境：
#   - 生产: docker compose --profile prod up -d
#   - 开发: docker compose --profile dev up -d
# ============================================

# Pinned on purpose. Without it the project name comes from the checkout
# directory, so the same compose file started from a worktree (`basjoo-ui`) or
# any other copy creates a second, empty set of volumes — `backend-data` becomes
# `basjoo-ui_backend-data` and the instance looks like it lost every admin
# account. Keep this in sync with the deployed directory name; override with
# `-p` only when you really want a separate stack.

name: basjoo

services:
  # ============================================
  # 基础设施服务 (所有环境共用)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: basjoo-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - basjoo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["prod", "dev"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: basjoo-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - basjoo-network
    healthcheck:
      # Qdrant image has bash but no curl; probe /readyz via bash TCP.
      test:
        - CMD
        - bash
        - -lc
        - >-
          exec 3<>/dev/tcp/localhost/6333;
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3;
          timeout 5 grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["prod", "dev"]

  # ============================================
  # Self-hosted embedding provider (the `local` KB embedding provider)
  # OpenAI-compatible /v1/embeddings on port 80, no API key. Only reachable from
  # basjoo-network. There is deliberately NO `depends_on: local-embed` on the
  # backend: a failed model download must not block the app from starting — the
  # example seed probes it lazily and self-heals on the next login.
  # ============================================
  local-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: basjoo-local-embed
    command:
      - "--model-id"
      - "ibm-granite/granite-embedding-97m-multilingual-r2"
      - "--max-client-batch-size"
      - "32"
      - "--auto-truncate"
      - "--max-batch-tokens"
      - "2048"
    volumes:
      - local-embed-cache:/data
    networks:
      - basjoo-network
    restart: unless-stopped
    profiles: ["prod", "dev"]
    healthcheck:
      # TEI cpu-1.8 ships bash but no wget (curl does exist); probe /health via bash TCP,
      # same style as the qdrant healthcheck above. Verified against a live TEI: exit 0.
      test:
        - CMD
        - bash
        - -lc
        - >-
          exec 3<>/dev/tcp/localhost/80;
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3;
          timeout 5 grep -q '200' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  scrapling-service:
    build:
      context: ./scrapling-service
      dockerfile: Dockerfile
    container_name: basjoo-scrapling
    restart: unless-stopped
    environment:
      # Same switch as the backend (see services/url_safety.py). Off by default.
      - SSRF_PROTECTION_ENABLED=${SSRF_PROTECTION_ENABLED:-false}
    networks:
      - basjoo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    profiles: ["prod", "dev"]

  # ============================================
  # 生产环境服务
  # ============================================
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: basjoo-backend
    environment:
      - DATABASE_URL=sqlite:////app/data/basjoo.db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:-}
      - SECRET_KEY_FILE=${SECRET_KEY_FILE:-/app/data/.secret_key}
      - DEFAULT_AGENT_ID=${DEFAULT_AGENT_ID:-}
      - REQUIRE_SECRET_KEY=${REQUIRE_SECRET_KEY:-true}
      - "ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}"
      - "ALLOWED_METHODS=${ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}"
      - "ALLOWED_HEADERS=${ALLOWED_HEADERS:-Content-Type,Authorization,X-Requested-With,Accept}"
      - DEFAULT_RATE_LIMIT=1000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - ENCRYPTION_KEY_FILE=${ENCRYPTION_KEY_FILE:-/app/data/.encryption_key}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-1000}
      - RATE_LIMIT_BURST_SIZE=${RATE_LIMIT_BURST_SIZE:-200}
      - LOG_LEVEL=INFO
      - SCRAPLING_SERVICE_URL=http://scrapling-service:8001
      - SSRF_PROTECTION_ENABLED=${SSRF_PROTECTION_ENABLED:-false}
    volumes:
      - backend-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      scrapling-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - basjoo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles: ["prod"]

  frontend-prod:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
    container_name: basjoo-frontend
    restart: unless-stopped
    networks:
      - basjoo-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["prod"]
    depends_on:
      - backend-prod

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: basjoo-nginx
    environment:
      - SERVER_DOMAIN=${SERVER_DOMAIN:-}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend-prod:
        condition: service_healthy
      frontend-prod:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - basjoo-network
    profiles: ["prod"]

  # ============================================
  # 开发环境服务
  # ============================================
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: basjoo-backend-dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/basjoo.db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - SECRET_KEY_FILE=${SECRET_KEY_FILE:-/app/data/.secret_key}
      - DEFAULT_AGENT_ID=${DEFAULT_AGENT_ID:-}
      - ALLOWED_ORIGINS=*
      - ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - ALLOWED_HEADERS=Content-Type,Authorization,X-Requested-With,Accept
      - DEFAULT_RATE_LIMIT=10000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - ENCRYPTION_KEY_FILE=${ENCRYPTION_KEY_FILE:-/app/data/.encryption_key}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-1000}
      - RATE_LIMIT_BURST_SIZE=${RATE_LIMIT_BURST_SIZE:-200}
      - LOG_LEVEL=DEBUG
      - SCRAPLING_SERVICE_URL=http://scrapling-service:8001
      - SSRF_PROTECTION_ENABLED=${SSRF_PROTECTION_ENABLED:-false}
    volumes:
      - backend-data:/app/data
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      scrapling-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - basjoo-network
    entrypoint: ["python3", "/app/docker-entrypoint.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles: ["dev"]
    develop:
      watch:
        - path: ./backend
          target: /app
          action: sync
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
            - venv/
            - data/
            - .git/
        - path: ./backend/requirements.txt
          action: rebuild

  frontend-dev:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile.dev
    container_name: basjoo-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=
      - VITE_WS_BASE_URL=
      - BACKEND_PROXY_TARGET=http://backend-dev:8000
    volumes:
      - ./frontend-nextjs:/app
      - /app/node_modules
    depends_on:
      - backend-dev
    restart: unless-stopped
    networks:
      - basjoo-network
    profiles: ["dev"]
    develop:
      watch:
        - path: ./frontend-nextjs
          target: /app
          action: sync
          ignore:
            - node_modules/
            - dist/
        - path: ./frontend-nextjs/package.json
          action: rebuild

  # ============================================
  # Widget cross-origin test host services
  # ============================================
  allowed-host:
    image: nginx:alpine
    container_name: basjoo-allowed-host
    profiles: ["dev"]
    volumes:
      - ./tests/environments/host-pages/allowed-host:/usr/share/nginx/html:ro
      - ./tests/environments/host-pages/nginx-allowed.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - basjoo-network

  blocked-host:
    image: nginx:alpine
    container_name: basjoo-blocked-host
    profiles: ["dev"]
    volumes:
      - ./tests/environments/host-pages/blocked-host:/usr/share/nginx/html:ro
      - ./tests/environments/host-pages/nginx-blocked.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - basjoo-network

  # Widget test hosts (prod profile)
  allowed-host-prod:
    image: nginx:alpine
    container_name: basjoo-allowed-host-prod
    profiles: ["prod"]
    networks:
      - basjoo-network
    volumes:
      - ./tests/environments/host-pages/html:/usr/share/nginx/html:ro
      - ./tests/environments/host-pages/nginx-allowed-prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  blocked-host-prod:
    image: nginx:alpine
    container_name: basjoo-blocked-host-prod
    profiles: ["prod"]
    networks:
      - basjoo-network
    volumes:
      - ./tests/environments/host-pages/html:/usr/share/nginx/html:ro
      - ./tests/environments/host-pages/nginx-blocked-prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  basjoo-network:
    driver: bridge

volumes:
  redis-data:
  backend-data:
  qdrant-data:
  local-embed-cache:
