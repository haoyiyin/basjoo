server {
    # The compose/nginx contract is `frontend-prod:3000`.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Served from this container under /assets/; hashed filenames => immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path renders index.html and lets the client
    # router resolve it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;
}
